# The branch `cesena` holds the themes the SMA-LS course decks were taught with (README.md); the decks'
# history pins them through the tags cesena-2006, cesena-2007, cesena-2008, cesena-2009. This job builds one frame on
# each theme, so that a change here is checked before any deck's history is rebuilt on it: a TeX error,
# or a theme read from anywhere but this branch, fails the job.

themes:
  image: texlive/texlive:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "cesena"
  script:
    - |
      for t in CesenaSMA2006 CesenaSMA2007 CesenaSMA2008 CesenaSMA2009; do
        pdflatex -interaction=nonstopmode -halt-on-error -recorder -jobname=$t "\def\cesenatheme{$t}\input{test/theme.tex}"
        grep -q "^INPUT \./beamertheme$t.sty" $t.fls
      done
  artifacts:
    paths:
      - "*.pdf"
    expire_in: 4 weeks
